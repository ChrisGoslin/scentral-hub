# Generates the weekly nota. product brief and commits it to the repo.
# Requires repo secrets: NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_KEY,
# ANTHROPIC_API_KEY. See docs/nota/PRODUCT_LOOP.md.
name: Weekly Product Brief
on:
  schedule:
    - cron: '0 23 * * 0' # Sunday 23:00 UTC
  workflow_dispatch: {}
jobs:
  generate-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Write .env.local from secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cat > .env.local << EOF
          NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL
          SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY
          ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          EOF
      - run: npm run brief:weekly
      - run: rm -f .env.local
      - name: Commit brief
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/weekly/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs(weekly): product brief $(date -u +%Y-%m-%d)"

          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git push "$REMOTE" HEAD:${GITHUB_REF_NAME}; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/3) — fetching and rebasing before retry."
            git fetch "$REMOTE" "${GITHUB_REF_NAME}"
            git rebase "FETCH_HEAD"
          done
          echo "Failed to push brief after 3 attempts." >&2
          exit 1
