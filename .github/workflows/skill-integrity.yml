name: Skill Integrity
# CI twin of the local .husky/pre-push guard (skill hash lock + lesson-ID
# uniqueness). The pre-push hook only runs on a machine that pushes
# directly — a merge performed through the GitHub UI never triggers it,
# which is exactly the path commit 55b2d2d could have taken (see
# docs/lessons.md L36-L40). This workflow closes that gap by running the
# same checks server-side on every push and PR against main. It is also
# the one guard in this repo confirmed to actually fire in a sandboxed
# dev environment without a working local git-hooks install (see L43).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-skill-integrity.mjs
      - run: node scripts/check-lesson-ids.mjs
