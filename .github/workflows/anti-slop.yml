name: Anti-Slop Gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anti-slop:
    name: Lint Quality & Anti-Slop
    runs-on: ubuntu-latest
    # peakoss/anti-slop reads PR-diff fields (event.pull_request.base) that
    # don't exist on a push event — it crashed with "Cannot read properties
    # of undefined (reading 'base')" on every push to main. It only has a
    # meaningful diff to check on pull_request anyway.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Anti-Slop Check
        uses: peakoss/anti-slop@v0.3.0
