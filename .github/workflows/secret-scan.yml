name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog OSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.97.0
        with:
          path: ./
          # On pull_request, base/head are the PR's diff endpoints. On push (to
          # main), `github.event.repository.default_branch` resolved to "main"
          # for both base and head here, since a push-to-main event IS main —
          # base and head were the same commit and TruffleHog scanned nothing.
          # Use the actual pre/post-push SHAs instead.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
          extra_args: --only-verified
