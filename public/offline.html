<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>nota. — Offline</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #F7F3EE;
    color: #2b2118;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    padding: 24px;
  }
  h1 {
    font-size: 20px;
    margin: 16px 0 8px;
  }
  p {
    font-size: 14px;
    color: #6b5d4f;
    margin: 0 0 24px;
    max-width: 320px;
  }
  button {
    background: #A0622A;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="wrap">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#A0622A" stroke-width="1.5">
      <path d="M12 2c4 5 7 8.5 7 12a7 7 0 1 1-14 0c0-3.5 3-7 7-12Z" />
    </svg>
    <h1>You're offline</h1>
    <p>nota. needs a connection for this page. Previously visited pages may still work.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
